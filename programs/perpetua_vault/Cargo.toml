[package]
name = "perpetua_vault"
version = "0.1.0"
description = "Perpetua: securitize the fee stream of a permanently locked DAMM v2 position"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "perpetua_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"

[dev-dependencies]
litesvm = "0.4"
solana-sdk = "2"
